# Pre-commit / prek configuration. Mirrors .github/workflows/go.yml so local
# checks catch what CI catches before pushing.
#
# Install:
#   prek install --install-hooks --hook-type pre-commit --hook-type pre-push
# Or with classic pre-commit:
#   pre-commit install --install-hooks --hook-type pre-commit --hook-type pre-push
#
# Hook stages:
#   pre-commit  → fast lint + build on every commit
#   pre-push    → full test suite (including Clojure compat) before push
#
# Escape hatch for in-progress work:
#   git commit --no-verify
#   git push   --no-verify

repos:
  # golangci-lint via the official upstream — the binary is installed by
  # prek/pre-commit on first run, so contributors don't need to install it
  # separately. Pinned to v2.x to match the v2-format .golangci.yml (migrated
  # in commit a8cdf40b / PR #82).
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full
        stages: [pre-commit]

  - repo: local
    hooks:
      # Fail fast on an accidentally-staged compiled executable (e.g. a stray
      # `go build` output). Magic-byte based (Mach-O / ELF / PE), so it ignores
      # the repo's legitimate binary assets — the LGB core bundle and images.
      # No type filter: it must inspect every staged file's leading bytes.
      # stages includes pre-push because a jj working copy is snapshotted by jj
      # itself: `git commit` never runs, so the pre-commit stage never fires for
      # a jj-based workflow. pre-push is the only gate those commits pass
      # through, and it is where prek runs under jj-pre-push.
      - id: forbid-compiled-binaries
        name: forbid committing compiled executables
        description: Reject staged Mach-O / ELF / PE binaries before they bloat history
        entry: python3 scripts/reject_compiled_binaries.py
        language: system
        # The pre-push net diff can be empty when an intermediate commit adds
        # and later deletes a binary. Run anyway; the script walks Git objects.
        always_run: true
        stages: [pre-commit, pre-push]

      # Auto-fix formatting before linters run. gofmt ships with Go.
      # goimports is fetched on demand via `go run ...@latest` so contributors
      # don't need a separate install; the module cache makes subsequent runs
      # cheap. -format-only matches gofmt's behavior plus import grouping,
      # without trying to resolve new imports from the source tree.
      - id: gofmt
        name: gofmt -s -w
        description: Auto-format Go sources (simplification + standard formatting)
        entry: gofmt -s -w
        language: system
        types: [go]
        stages: [pre-commit]

      - id: goimports
        name: goimports -w -format-only
        description: Group and order imports (run after gofmt)
        entry: go run golang.org/x/tools/cmd/goimports@latest -w -format-only
        language: system
        types: [go]
        stages: [pre-commit]

      - id: go-build
        name: go build ./...
        description: Verify the project builds (mirrors CI build step)
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      # Guard: no test files at the repo root. Test files belong next to the
      # package they test (pkg/<x>/, test/, test/e2e/). Stdlib-only Python,
      # scans the root regardless of which files staged. Mirrors the CI job.
      - id: check-test-location
        name: no test files at repo root
        description: Reject *_test.go / *_test.lg added at the repository root
        entry: python3 scripts/check_test_location.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard the single-source Go version pin. go.mod owns it (the Makefile
      # derives GO-VERSION from it; CI uses `go-version-file: go.mod`), so
      # mise.toml carries no `go` entry. Absent passes silently; re-adding one
      # is allowed only while it agrees with go.mod, so the two can never
      # disagree unnoticed the way Makefile/mise.toml did before #677.
      # Runs when either file is staged; stdlib-only Python.
      - id: check-mise-go-sync
        name: mise.toml Go pin agrees with go.mod
        description: Reject a mise.toml go entry that disagrees with go.mod's version
        entry: python3 scripts/check_mise_go_sync.py
        language: system
        files: ^(mise\.toml|go\.mod)$
        pass_filenames: false
        stages: [pre-commit]

      # Frontmatter maintenance for docs/**/*.md: stub on missing,
      # bump `last-verified:` on staged docs. Never touches
      # `human-verified:` or any human-authored field. Stdlib-only
      # Python — pre-commit itself already requires Python, so this
      # adds no new dependency. See docs/frontmatter-hook.md.
      - id: docs-frontmatter
        name: docs frontmatter (stub + last-verified bump)
        description: Maintain status/last-verified frontmatter on docs/**/*.md
        entry: python3 scripts/docs_frontmatter_hook.py
        language: system
        files: ^docs/.*\.md$
        stages: [pre-commit]

      - id: go-test
        name: go test ./... -skip TestClojureTestSuite
        description: Run Go test suite excluding the slow Clojure compat suite (mirrors CI test step)
        entry: go test -short -timeout 600s ./... -skip TestClojureTestSuite
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      - id: clojure-compat-suite
        name: Clojure compatibility test suite
        description: Run the vendored jank-lang/clojure-test-suite (mirrors CI compat step)
        entry: go test ./test/ -count=1 -run TestClojureTestSuite
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      # Blocking performance ratchet. Always run before every push: Go/runtime,
      # generated-bundle, or benchmark-policy changes can regress metrics even
      # when no benchmark file is part of the pushed diff. `jj push` routes
      # through pr-claim-gate -> jj-pre-push -> this prek stage.
      - id: bench-ratchet
        name: benchmark performance ratchet
        description: Fail if anchor-normalized speed or deterministic allocation/size metrics regress
        entry: make bench-ratchet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Lowering-coverage ratchet (ITER-0021). ~60s, so pre-push not
      # pre-commit, and deliberately NOT in CI. Fails if a form newly falls
      # back to bytecode / vm dispatch (a trampoline, not a direct/native
      # call) vs docs/perf/ir-stress-baseline.edn — or if the corpus :total
      # drifted. always_run: a regression can come from a .lg OR a Go runtime
      # change, so it must run on every push, not only when *.go is staged.
      # NOTE: raw `jj git push` does not run Git hooks; use the repository's
      # `jj push` alias, which routes through jj-pre-push and this prek stage.
      - id: ir-stress-gate
        name: ir-stress lowering-coverage ratchet (ITER-0021)
        description: Fail if native-lowering coverage regressed vs the committed baseline
        entry: make ir-stress-gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Generated-artifact provenance gate (#641). ~1.3s: a pure hash
      # comparison of the manifest's declared inputs against the tree, with no
      # regeneration and no build. Editing any declared input restages the
      # outputs, and no server-side operation can refresh the manifest for you
      # — not a rebase, not a merge driver, not the stack UI — so this has to
      # run on a developer machine. always_run: a declared input can be a .go
      # or a .lg file, so it must run on every push rather than on a types
      # filter.
      # NOTE: jj does not run git hooks — jj users gate with `make
      # check-generated-manifest` (the same check) before pushing.
      - id: check-generated-manifest
        name: generated-artifact manifest freshness (#641)
        description: Fail if a declared generator input changed without `make generate`
        entry: go run ./cmd/check-generated
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.2.2
    hooks:
      - id: checkmake
        stages: [pre-commit]
