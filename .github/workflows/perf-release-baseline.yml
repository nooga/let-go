name: Perf Release Baseline

# On every release tag (v*), freeze an immutable, anchor-normalized perf
# baseline at docs/perf/historical/<tag>.json (same convention as the existing
# docs/perf/historical/v1.8.0.json). main is branch-protected, so the frozen
# baseline lands via an auto-opened PR rather than a direct push.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to freeze a baseline for (e.g. v1.9.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: perf-release-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi
          printf 'name=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Check for an existing frozen baseline
        id: baseline
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          out="docs/perf/historical/${TAG}.json"
          branch="perf/baseline-${TAG}"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ -e "$out" ]] || git cat-file -e "origin/main:${out}" 2>/dev/null; then
            echo "Baseline ${out} is already frozen; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            echo "Automation branch ${branch} already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'path=%s\n' "$out" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.baseline.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate lowered runtime
        if: steps.baseline.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Releases before v1.10.0 predate the lowered-Go tree and have no
          # `lowered` target, so an unconditional `make lowered` makes those tags
          # unbackfillable. Skip when the target is absent: at those releases
          # `-tags gogen_ir` matches no files and is already a no-op.
          if make -n lowered >/dev/null 2>&1; then
            make lowered
          else
            echo "no 'lowered' target at this tag; pre-lowered-Go release, skipping"
          fi

      - name: Capture immutable per-release baseline
        if: steps.baseline.outputs.skip != 'true'
        env:
          OUT: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p docs/perf/historical
          # `update` is supported by every backfillable release, including v1.9.0.
          # The preflight and this assertion preserve snapshot-style immutability.
          test ! -e "$OUT"
          go run ./cmd/bench-ratchet \
            -full \
            -count 3 \
            -benchtime 2s \
            -timeout 30m \
            -baseline "$OUT" \
            update
          echo "FROZEN=$OUT" >> "$GITHUB_ENV"

      - name: Open PR with the frozen baseline
        if: steps.baseline.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          branch="perf/baseline-${tag}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/perf/historical/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit (already frozen?)."
            exit 0
          fi
          git commit -m "perf: freeze release baseline ${tag}"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "perf: freeze release baseline ${tag}" \
            --body "Immutable, anchor-normalized perf baseline captured at \`${tag}\` (\`${FROZEN}\`). Auto-generated by the Perf Release Baseline workflow."
